[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tableau-rayfin-migration"
version = "0.1.0"
description = "Reusable Tableau-to-Fabric/Rayfin migration skill and read-only validation helpers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "defusedxml>=0.7.1,<1",
    "jsonschema>=4.23,<5",
    "tableauhyperapi>=0.0.20000,<1",
    "tableauserverclient>=0.38,<1",
    "keyring>=25,<26",
    "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10"]

[project.scripts]
tableau-migration = "tableau_migration.cli:main"

[tool.setuptools.packages.find]
where = ["tools/tableau-migration/src"]

[tool.pytest.ini_options]
testpaths = ["tests", "migration-evaluation/tests"]
